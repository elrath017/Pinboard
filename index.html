<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b5cf6' stroke='%23000' stroke-width='2.5' stroke-linecap='round' stroke-linejoin='round'><rect width='18' height='18' x='3' y='3' rx='2'/><circle cx='8.5' cy='8.5' r='1.5'/><polyline points='21 15 16 10 5 21'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pinboard — Visual Canvas & Daily Tasks</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var urlParam = new URLSearchParams(window.location.search).get('theme');
          var saved = localStorage.getItem('pinboard_theme');
          // Default to Day (Light) mode unless user explicitly selected 'dark' or ?theme=dark
          var isDark = urlParam === 'dark' || (urlParam !== 'light' && saved === 'dark');
          if (isDark) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
    </script>
  </head>
  <body class="bg-pinboard-grid text-zinc-900 dark:text-zinc-100 antialiased selection:bg-purple-200 selection:text-purple-950 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
